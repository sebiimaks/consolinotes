<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{NONCE}' 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; media-src 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="initial-scale=1.0">
    <title>{TITLE}</title>
    <link href="main.css" rel="stylesheet">
    {INLINE_CSS}
    {THEME_CSS}
    {MATH_JAX_JS}
    <style>
        code { white-space: pre-wrap !important; overflow-x: hidden; }
        pre { overflow-x: hidden; }
        .blocked-attachment { opacity: .7; font-size: .9em; }
        .preview-toc ul { list-style-type: none; }
    </style>
    <script nonce="{NONCE}" defer src="js/highlight.min.js"></script>
    <script nonce="{NONCE}" defer src="js/mermaid.min.js"></script>
    <script nonce="{NONCE}">
        const previewTheme = '{FSNOTES_THEME}';
        function switchToDarkMode() { document.body.classList.add('darkmode'); }
        function switchToLightMode() { document.body.classList.remove('darkmode'); }
        function getElementsByText(str, tag = 'h1') {
            return Array.from(document.getElementsByTagName(tag)).filter(el => el.textContent.trim() === str.trim());
        }
        function loadTOC() {
            const toc = document.getElementById('toc');
            const list = document.createElement('ul');
            list.className = 'preview-toc';
            document.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach((heading, index) => {
                heading.id = 'heading-' + index;
                if (!toc) return;
                const item = document.createElement('li');
                item.style.marginLeft = (Number(heading.tagName.substring(1)) - 1) + 'em';
                const link = document.createElement('a');
                link.href = '#' + heading.id;
                link.textContent = heading.textContent;
                item.appendChild(link);
                list.appendChild(item);
            });
            if (toc) toc.appendChild(list);
        }
        function loadMermaid() {
            if (typeof mermaid === 'undefined') return;
            const dark = document.body.classList.contains('darkmode');
            const config = {startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default', flowchart: {useMaxWidth: true, htmlLabels: false}};
            if (previewTheme === 'consolinotes') {
                const css = getComputedStyle(document.body);
                const color = name => css.getPropertyValue(name).trim();
                config.theme = 'base';
                config.themeVariables = {
                    darkMode: dark, fontFamily: "'JetBrains Mono', monospace",
                    background: color('--cn-bg'), primaryColor: color('--cn-bar'),
                    primaryTextColor: color('--cn-bright'), primaryBorderColor: color('--cn-accent'),
                    secondaryColor: color('--cn-code'), tertiaryColor: color('--cn-bg'),
                    lineColor: color('--cn-accent'), textColor: color('--cn-fg'),
                    noteBkgColor: color('--cn-code'), noteTextColor: color('--cn-fg'), noteBorderColor: color('--cn-yellow')
                };
            }
            mermaid.initialize(config);
            mermaid.init(undefined, document.querySelectorAll('.language-mermaid'));
        }
        window.addEventListener('DOMContentLoaded', () => {
            loadTOC();
            document.querySelectorAll('li input[type=checkbox]').forEach(box => {
                const item = box.closest('li');
                item.closest('ul,ol').classList.add('cb');
                item.classList.toggle('strike', box.checked);
                box.addEventListener('change', () => item.classList.toggle('strike', box.checked));
            });
            if (typeof hljs !== 'undefined') {
                document.querySelectorAll('pre code:not(.language-mermaid)').forEach(code => hljs.highlightBlock(code));
            }
            loadMermaid();
        });
    </script>
</head>
<body class="{FSNOTES_APPEARANCE} {FSNOTES_PLATFORM} {FSNOTES_THEME}" id="preview">
    {NOTE_BODY}
</body>
</html>
